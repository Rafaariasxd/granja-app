name: granja_app
description: "App de la granja avícola de la familia"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  path: ^1.9.1
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
